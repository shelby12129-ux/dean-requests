[tool.ruff]
# Стиль кода проекта
line-length = 100
target-version = "py311"

# Исключаем из проверки
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Набор правил:
# E, W — стиль (PEP 8)
# F — ошибки логики
# I — сортировка импортов
# N — именование
# D — docstrings
# S — безопасность
select = ["E", "W", "F", "I", "N", "D", "S"]

# Исключения
ignore = [
    "D100",  # docstring на уровне модуля (для __init__.py)
    "D104",  # docstring в пакете
    "S101",  # assert в тестах
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S"]
"__init__.py" = ["D"]
